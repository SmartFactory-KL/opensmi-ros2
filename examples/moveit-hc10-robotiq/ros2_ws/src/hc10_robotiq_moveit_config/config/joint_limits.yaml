#
# The limits MoveIt plans with. The velocities are the HC10's own (from the URDF, 130, 130, 180, 180,
# 250 and 250 degrees per second) halved, which is plenty for a pick and place on a table; the
# accelerations are this example's choice. Pilz needs both for every joint it plans for.

default_velocity_scaling_factor: 0.5
default_acceleration_scaling_factor: 0.5

joint_limits:
  joint_1_s:
    has_velocity_limits: true
    max_velocity: 1.134
    has_acceleration_limits: true
    max_acceleration: 2.0
  joint_2_l:
    has_velocity_limits: true
    max_velocity: 1.134
    has_acceleration_limits: true
    max_acceleration: 2.0
  joint_3_u:
    has_velocity_limits: true
    max_velocity: 1.571
    has_acceleration_limits: true
    max_acceleration: 2.0
  joint_4_r:
    has_velocity_limits: true
    max_velocity: 1.571
    has_acceleration_limits: true
    max_acceleration: 3.0
  joint_5_b:
    has_velocity_limits: true
    max_velocity: 2.182
    has_acceleration_limits: true
    max_acceleration: 3.0
  joint_6_t:
    has_velocity_limits: true
    max_velocity: 2.182
    has_acceleration_limits: true
    max_acceleration: 3.0
  robotiq_85_left_knuckle_joint:
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 1.0

# Builds the API reference from the docstrings with pydoctor (configured in pyproject.toml) and
# publishes it to GitHub Pages. Enable Pages with the source "GitHub Actions" in the repository settings.

name: Publish API doc to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a running deployment is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pydoctor
      - run: pydoctor
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./apidocs
      - id: deployment
        uses: actions/deploy-pages@v4

# Publishes to PyPI when a GitHub release is published, by Trusted Publishing: no token is stored.
# The release creates the tag, and setuptools-scm takes the version from it. Register this workflow
# (python-publish.yml, environment "pypi") as a trusted publisher on PyPI before the first release,
# and mark a release candidate as a pre-release.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release-build:
    needs: [checks]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # setuptools-scm reads the version from the tag
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build release distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    needs: [release-build]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # mandatory for trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/opensmi-ros2
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

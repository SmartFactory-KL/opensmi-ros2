# Early warning for upstream changes: the test suite against the current main branches of opensmi-server
# and opensmi-core instead of the pinned releases. It runs every Monday and by hand. Raise the pins in
# constraints.txt only together with a green run of this workflow.

name: opensmi main

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: test (opensmi main)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: |
          python -m pip install \
            "OpenSMI-Server @ git+https://github.com/SmartFactory-KL/opensmi-server@main" \
            "OpenSMI-Core @ git+https://github.com/SmartFactory-KL/opensmi-core@main" \
            -e . --group dev
      - run: pytest -n auto

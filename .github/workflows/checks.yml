# The checks of this repository, without hardware: secret scan, lint, types, the definition catalog,
# the test suite on Python 3.12 and 3.11, and the tests that need a live ROS2 Jazzy graph.
# python-publish.yml calls this workflow before it publishes, like the other OpenSMI repositories.

name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # lets the publishing workflow reuse this one

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The scan covers the checked-out files; the history starts clean on GitHub.
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 dir /repo --redact --no-banner --verbose

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # setuptools-scm reads the version from the tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c constraints.txt -e . --group dev
      - run: ruff check .
      - run: ruff format --check .
      - run: reuse lint

  types:
    name: types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c constraints.txt -e . --group dev
      - run: basedpyright # checks src and tests, see pyproject.toml

  catalog:
    name: catalog
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c constraints.txt -e . --group dev
      # Needs a network and nothing else: no ROS2, no apt, no container.
      - run: python -m tools.catalog_check

  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.11"] # 3.11 is the declared floor
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c constraints.txt -e . --group dev
      - run: pytest -n auto

  jazzy:
    name: test (ROS2 Jazzy)
    runs-on: ubuntu-24.04
    container:
      # ros:jazzy-ros-base, pinned by digest (resolved 2026-09-19): the ROS package repository keeps
      # one version of each package, so a tag would drift. Re-pin deliberately.
      image: ros@sha256:c3706ef0a0aa45413c07803cf433602f543b22e45b4855f6fca955c2d8ecc4e8
    steps:
      # git first: setuptools-scm reads the version from the repository.
      # `example_interfaces` is not in ros-base and the action tests need its Fibonacci action;
      # `control_msgs` and `controller_manager_msgs` carry the trajectory action and the listing
      # services of the structured-field tests.
      - run: >
          apt-get update && apt-get install -y --no-install-recommends
          git python3-pip python3-venv ros-jazzy-example-interfaces ros-jazzy-control-msgs
          ros-jazzy-controller-manager-msgs
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # A venv rather than the image's Python: apt-installed distributions there carry no RECORD
      # file, so pip cannot replace one. --system-site-packages keeps rclpy importable.
      - run: |
          python3 -m venv --system-site-packages /opt/venv
          /opt/venv/bin/python -m pip install --upgrade pip
          /opt/venv/bin/python -m pip install -c constraints.txt -e . --group dev
      - run: |
          . /opt/ros/jazzy/setup.sh
          /opt/venv/bin/python -m pytest -m jazzy

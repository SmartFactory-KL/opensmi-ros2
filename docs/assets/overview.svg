<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">OpenSMI and the OpenSMI-ROS2 plugin between ROS 2 and OPC UA clients</title>
<desc id="d">A ROS 2 system talks to the OpenSMI-ROS2 plugin. The plugin runs inside OpenSMI, which provides the OPC UA server and the SkillSet model. OPC UA clients such as an orchestrator or an HMI connect to OpenSMI.</desc>
<style>
.lbl{fill:#475569}.arrow{stroke:#64748b}.head{fill:#64748b}
@media (prefers-color-scheme: dark){.lbl{fill:#cbd5e1}.arrow{stroke:#94a3b8}.head{fill:#94a3b8}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z"/></marker></defs>
<rect x="20" y="105" width="190" height="200" rx="12" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.5"/>
<text x="115" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">ROS 2 system</text>
<text x="115" y="176" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">Topics</text>
<text x="115" y="200" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">Services</text>
<text x="115" y="224" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">Actions</text>
<text x="115" y="248" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">Parameters</text>
<text x="115" y="272" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">TF and diagnostics</text>
<rect x="310" y="30" width="640" height="340" rx="14" fill="#efeafc" stroke="#7a5cc7" stroke-width="1.5"/>
<text x="630" y="62" text-anchor="middle" font-size="18" font-weight="700" fill="#4c1d95">OpenSMI</text>
<text x="630" y="82" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">the framework: an OPC UA server and the SkillSet information model</text>
<rect x="330" y="105" width="250" height="240" rx="12" fill="#e3f6ec" stroke="#1c9a64" stroke-width="1.5"/>
<text x="455" y="138" text-anchor="middle" font-size="17" font-weight="700" fill="#065f46">OpenSMI-ROS2</text>
<text x="455" y="157" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">the plugin for ROS 2</text>
<rect x="346" y="176" width="218" height="40" rx="8" fill="#ffffff" stroke="#1c9a64"/>
<text x="455" y="193" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Runtime</text>
<text x="455" y="209" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">talks to ROS 2 with rclpy</text>
<rect x="346" y="222" width="218" height="40" rx="8" fill="#ffffff" stroke="#1c9a64"/>
<text x="455" y="239" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Bindings</text>
<text x="455" y="255" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">choose what to expose</text>
<rect x="346" y="268" width="218" height="40" rx="8" fill="#ffffff" stroke="#1c9a64"/>
<text x="455" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Projection</text>
<text x="455" y="301" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">turns ROS 2 types into nodes</text>
<text x="455" y="332" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">declared in machine.toml or Python</text>
